name: Test Docker Builds

on:
  pull_request:
    branches: [main]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.find.outputs.images }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - id: find
        run: |
          images=$(find . -name Dockerfile -not -path './.git/*' \
            | xargs -I{} dirname {} | sed 's|^\./||' \
            | jq -R . | jq -sc .)
          echo "images=$images" >> $GITHUB_OUTPUT

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.image }}
          push: false

  ci-success:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all builds succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more image builds failed (build result: ${{ needs.build.result }})"
            exit 1
          fi
          echo "All image builds succeeded"
